<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<div class="container">

    <h2>Deposit Money</h2>

    <input
        type="text"
        id="depositor"
        placeholder="Depositor Address"
    >

    <input
        type="number"
        id="amount"
        placeholder="Amount"
    >

    <button class="btn" onclick="deposit()">
        Deposit Money
    </button>

    <button class="btn" onclick="transaction()">
        View Transaction
    </button>

    <form action="/main" method="post">
        <input type="submit" value="Main">
    </form>

    <p id="view_depositor"></p>
    <p id="view_amount"></p>

</div>


<script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>

<script>

const contractAddress = "0xF1889e7D15d6bF10176EE9E485C0c259eA557Fb2";


const contractABI = [

                // deposit_money(address,uint256)
                {
                    "inputs": [
                        {
                            "internalType": "address",
                            "name": "customer_input",
                            "type": "address"
                        },
                        {
                            "internalType": "uint256",
                            "name": "amount_input",
                            "type": "uint256"
                        }
                    ],
                    "name": "deposit_money",
                    "outputs": [],
                    "stateMutability": "nonpayable",
                    "type": "function"
                },

                // deposit_view()
                {
                    "inputs": [],
                    "name": "deposit_view",
                    "outputs": [
                        {
                            "internalType": "address",
                            "name": "",
                            "type": "address"
                        },
                        {
                            "internalType": "uint256",
                            "name": "",
                            "type": "uint256"
                        }
                    ],
                    "stateMutability": "view",
                    "type": "function"
                }

            ];


const web3 = new Web3(window.ethereum);

const contract = new web3.eth.Contract(
    contractABI,
    contractAddress
);


// ================================
// Deposit
// ================================

async function deposit() {

    try {

        // Connect MetaMask
        const accounts = await web3.eth.requestAccounts();

        console.log("MetaMask account:", accounts[0]);


        // Get input
        const depositor =
            document.getElementById("depositor").value.trim();

        const amount =
            document.getElementById("amount").value;


        console.log("Depositor:", depositor);
        console.log("Amount:", amount);


        // Check address
        if (!web3.utils.isAddress(depositor)) {

            alert("Please enter a valid Ethereum address.");

            return;
        }


        // Check amount
        if (!amount || Number(amount) <= 0) {

            alert("Please enter a valid amount.");

            return;
        }


        // Send transaction
        const result =
            await contract.methods
                .deposit_money(
                    depositor,
                    amount
                )
                .send({
                    from: accounts[0]
                });


        console.log("Transaction successful:");
        console.log(result);


        alert(
            "Deposit successful!\n\n" +
            "Transaction Hash:\n" +
            result.transactionHash
        );


    } catch (error) {

        console.error("Deposit failed:", error);

        alert(
            "Deposit failed:\n" +
            error.message
        );

    }

}


// ================================
// View Transaction
// ================================

async function transaction() {

    try {

        const result =
            await contract.methods
                .deposit_view()
                .call();


        console.log("Customer:", result[0]);
        console.log("Amount:", result[1]);


        document.getElementById("view_depositor")
            .innerText =
            "Depositor: " + result[0];


        document.getElementById("view_amount")
            .innerText =
            "Amount: " + result[1];


    } catch (error) {

        console.error("Cannot read deposit:", error);

        alert(
            "Failed to read deposit:\n" +
            error.message
        );

    }

}

</script>

</body>
